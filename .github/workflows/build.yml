name: Build DeskMate Multi-Platform Releases

on:
  push:
    branches:
      - main
      - dev
      - linux-build

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      target_platform:
        description: "Select platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

# ============================================================
# 1. PYTHON LINT
# ============================================================

jobs:

  flake8-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Critical Flake8 checks
        working-directory: terminal-ai-agent
        run: |
          flake8 . \
            --select=E9,F63,F7,F82 \
            --exclude=.venv,venv,build,dist,__pycache__

      - name: Complexity and line length
        working-directory: terminal-ai-agent
        run: |
          flake8 . \
            --max-complexity=15 \
            --max-line-length=120 \
            --exclude=.venv,venv,build,dist,__pycache__ \
            --exit-zero


# ============================================================
# 2. PYTHON UNIT TESTS
# ============================================================

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: flake8-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: terminal-ai-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: terminal-ai-agent
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml || true


# ============================================================
# 3. PYTHON SECURITY - BANDIT
# ============================================================

  bandit-security:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        working-directory: terminal-ai-agent
        run: |
          bandit -r . \
            -x .venv,venv,build,dist,__pycache__ \
            -ll \
            -ii


# ============================================================
# 4. PYTHON DEPENDENCY VULNERABILITY SCAN
# ============================================================

  dependency-security:
    name: Python Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: terminal-ai-agent
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        working-directory: terminal-ai-agent
        run: |
          pip-audit


# ============================================================
# 5. SECRET SCANNING
# ============================================================

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ============================================================
# 6. FILESYSTEM VULNERABILITY SCAN
# ============================================================

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


# ============================================================
# 7. FLUTTER QUALITY
# ============================================================

  flutter-quality:
    name: Flutter Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Flutter analyze
        working-directory: deskmate_app
        run: |
          flutter analyze --no-fatal-infos

      - name: Check formatting
        working-directory: deskmate_app
        run: |
          dart format \
            --output=none \
            --set-exit-if-changed \
            .


# ============================================================
# 8. CHECK CHANGED FILES
# ============================================================

  check-changes:
    name: Check Changed Components
    runs-on: ubuntu-latest

    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      macos: ${{ steps.filter.outputs.macos }}
      linux: ${{ steps.filter.outputs.linux }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            windows:
              - 'deskmate_app/**'
              - 'terminal-ai-agent/**'
              - 'deskmate_app/windows/**'
              - '.github/workflows/**'

            macos:
              - 'deskmate_app/**'
              - 'terminal-ai-agent/**'
              - 'deskmate_app/macos/**'
              - '.github/workflows/**'

            linux:
              - 'deskmate_app/**'
              - 'terminal-ai-agent/**'
              - 'deskmate_app/linux/**'
              - '.github/workflows/**'
              - 'scripts/**'


# ============================================================
# 9. WINDOWS BUILD
# ============================================================

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    needs:
      - flake8-lint
      - python-tests
      - bandit-security
      - dependency-security
      - secret-scan
      - trivy-scan
      - flutter-quality
      - check-changes

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.target_platform == 'all' ||
          github.event.inputs.target_platform == 'windows'
        )
      )
      ||
      (
        github.event_name == 'push' &&
        needs.check-changes.outputs.windows == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Python environment
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -r requirements.txt
          .\.venv\Scripts\pip.exe install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          .\.venv\Scripts\pyinstaller.exe deskmate_backend.spec --clean

      - name: Copy backend executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "deskmate_app\assets\backend" -Force
          Copy-Item `
            "terminal-ai-agent\dist\deskmate_backend.exe" `
            "deskmate_app\assets\backend\deskmate_backend.exe" `
            -Force

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Build Windows application
        working-directory: deskmate_app
        run: |
          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          if (!(Test-Path "deskmate_app\build\windows\x64\runner\Release")) {
            Write-Error "Windows build output not found"
            exit 1
          }

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $releasePath = "deskmate_app\build\windows\x64\runner\Release"
          $zipPath = "DeskMate-Windows.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          $tempStage = "DeskMate"
          if (Test-Path $tempStage) { Remove-Item $tempStage -Recurse -Force }
          Copy-Item -Path $releasePath -Destination $tempStage -Recurse
          Compress-Archive -Path $tempStage -DestinationPath $zipPath -Force
          Remove-Item $tempStage -Recurse -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-Windows-Zip
          path: DeskMate-Windows.zip

      - name: Publish Windows Continuous Pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          target_commitish: ${{ github.sha }}
          name: "DeskMate Continuous Build"
          body: "Automated continuous build from ${{ github.ref_name }} branch (commit ${{ github.sha }})."
          prerelease: true
          files: |
            DeskMate-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ============================================================
# 10. MACOS BUILD
# ============================================================

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    needs:
      - flake8-lint
      - python-tests
      - bandit-security
      - dependency-security
      - secret-scan
      - trivy-scan
      - flutter-quality
      - check-changes

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.target_platform == 'all' ||
          github.event.inputs.target_platform == 'macos'
        )
      )
      ||
      (
        github.event_name == 'push' &&
        needs.check-changes.outputs.macos == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Python environment
        working-directory: terminal-ai-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        run: |
          .venv/bin/pyinstaller deskmate_backend.spec --clean

      - name: Copy backend binary
        run: |
          mkdir -p deskmate_app/assets/backend
          cp \
            terminal-ai-agent/dist/deskmate_backend \
            deskmate_app/assets/backend/deskmate_backend

          chmod +x deskmate_app/assets/backend/deskmate_backend

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Build macOS application
        working-directory: deskmate_app
        run: |
          flutter build macos --release

      - name: Verify macOS build
        run: |
          test -d deskmate_app/build/macos/Build/Products/Release

      - name: Create DMG
        run: |
          mkdir -p dmg

          cp -R \
            deskmate_app/build/macos/Build/Products/Release/*.app \
            dmg/

          # Add standard drag-and-drop Applications shortcut
          ln -s /Applications dmg/Applications

          # Ensure global executable and read permissions
          chmod -R u+rwX,go+rX dmg/*.app
          chmod +x dmg/*.app/Contents/MacOS/* || true
          find dmg/*.app/Contents -type f -name "deskmate_backend" -exec chmod +x {} + || true

          # Strip extended quarantine attributes before creating disk image
          xattr -cr dmg/*.app || true

          # Ad-hoc sign bundle so macOS Gatekeeper approves the binaries
          codesign --force --deep --sign - dmg/*.app || true

          # Add native double-click auto-installer inside DMG (zero-setup)
          cp scripts/install_macos.command "dmg/Install DeskMate.command"
          chmod +x "dmg/Install DeskMate.command"

          hdiutil create \
            -volname "DeskMate" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            DeskMate-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-DMG
          path: DeskMate-macOS.dmg

      - name: Zip macOS application
        run: |
          cd deskmate_app/build/macos/Build/Products/Release
          zip -r ../../../../../DeskMate-macOS.zip *.app

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-App
          path: DeskMate-macOS.zip

      - name: Publish Continuous Pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          target_commitish: ${{ github.sha }}
          name: "DeskMate Continuous Build"
          body: "Automated continuous build from ${{ github.ref_name }} branch (commit ${{ github.sha }})."
          prerelease: true
          files: |
            DeskMate-macOS.dmg
            DeskMate-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ============================================================
# 11. LINUX BUILD
# ============================================================

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    needs:
      - flake8-lint
      - python-tests
      - bandit-security
      - dependency-security
      - secret-scan
      - trivy-scan
      - flutter-quality
      - check-changes

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.target_platform == 'all' ||
          github.event.inputs.target_platform == 'linux'
        )
      )
      ||
      (
        github.event_name == 'push' &&
        needs.check-changes.outputs.linux == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Python environment & build backend
        working-directory: terminal-ai-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller
          .venv/bin/pyinstaller deskmate_backend.spec --clean

      - name: Copy backend binary to Flutter assets
        run: |
          mkdir -p deskmate_app/assets/backend
          cp \
            terminal-ai-agent/dist/deskmate_backend \
            deskmate_app/assets/backend/deskmate_backend
          chmod +x deskmate_app/assets/backend/deskmate_backend

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Build Linux application
        working-directory: deskmate_app
        run: |
          flutter build linux --release

      - name: Verify Linux build
        run: |
          test -f deskmate_app/build/linux/x64/release/bundle/DeskMate

      - name: Package Linux tar.gz
        run: |
          mkdir -p package/DeskMate
          cp -r deskmate_app/build/linux/x64/release/bundle/* package/DeskMate/
          cp scripts/run_linux.sh package/DeskMate/run.sh
          cp scripts/install_linux.sh package/DeskMate/install_linux.sh
          cp scripts/deskmate.desktop package/DeskMate/deskmate.desktop
          cp deskmate_app/assets/app_icon.png package/DeskMate/deskmate.png
          chmod +x package/DeskMate/DeskMate
          chmod +x package/DeskMate/run.sh
          chmod +x package/DeskMate/install_linux.sh
          chmod +x package/DeskMate/data/flutter_assets/assets/backend/deskmate_backend || true
          tar -czf DeskMate-Linux-x64.tar.gz -C package DeskMate

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-Linux-Tar
          path: DeskMate-Linux-x64.tar.gz

      - name: Publish Linux Continuous Pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          target_commitish: ${{ github.sha }}
          name: "DeskMate Continuous Build"
          body: "Automated continuous build from ${{ github.ref_name }} branch (commit ${{ github.sha }})."
          prerelease: true
          files: |
            DeskMate-Linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


