name: Set up the DeskMate engine
description: Python plus the engine's requirements (the same set is tested, audited and shipped).

inputs:
  extras:
    description: Extra tools to install (e.g. "pytest flake8" or "pyinstaller").
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: deskmate_engine/requirements.txt

    - name: Install engine requirements
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r deskmate_engine/requirements.txt
        # litellm declares filelock<4; lift it past the published advisory
        # (filelock's API is unchanged for litellm's use).
        pip install --no-deps "filelock>=4.2.1"
        if [ -n "${{ inputs.extras }}" ]; then pip install ${{ inputs.extras }}; fi
