name: Build DeskMate Multi-Platform Releases

on:
  push:
    branches:
      - main
      - test

  pull_request:
    branches:
      - main
      - test

  workflow_dispatch:
    inputs:
      target_platform:
        description: "Select platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows

# ============================================================
# 1. PYTHON LINT
# ============================================================

jobs:
  flake8-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Critical Flake8 checks
        working-directory: terminal-ai-agent
        run: |
          flake8 . \
            --select=E9,F63,F7,F82 \
            --exclude=.venv,venv,build,dist,__pycache__

  # ============================================================
  # 2. BUILD MACOS
  # ============================================================

  macos-build:
    name: Build macOS
    runs-on: macos-latest

    needs:
      - flake8-lint
      - python-tests
      - bandit-security
      - dependency-security
      - secret-scan
      - trivy-scan
      - flutter-quality
      - check-changes

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.target_platform == 'all' ||
          github.event.inputs.target_platform == 'macos'
        )
      )
      ||
      (
        github.event_name == 'push' &&
        needs.check-changes.outputs.macos == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Python environment
        working-directory: terminal-ai-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        run: |
          .venv/bin/pyinstaller deskmate_backend.spec --clean

      - name: Copy backend binary
        run: |
          mkdir -p deskmate_app/assets/backend
          cp \
            terminal-ai-agent/dist/deskmate_backend \
            deskmate_app/assets/backend/deskmate_backend

          chmod +x deskmate_app/assets/backend/deskmate_backend

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Build macOS application
        working-directory: deskmate_app
        run: |
          flutter build macos --release

      - name: Verify macOS build
        run: |
          test -d deskmate_app/build/macos/Build/Products/Release

      - name: Create DMG
        run: |
          mkdir -p dmg

          cp -R \
            deskmate_app/build/macos/Build/Products/Release/*.app \
            dmg/

          hdiutil create \
            -volname "DeskMate" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            DeskMate-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-DMG
          path: DeskMate-macOS.dmg

      - name: Zip macOS application
        run: |
          cd deskmate_app/build/macos/Build/Products/Release
          zip -r ../../../../../DeskMate-macOS.zip *.app

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-App
          path: DeskMate-macOS.zip