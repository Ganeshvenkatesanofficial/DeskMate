name: Build DeskMate Multi-Platform Releases

on:
  push:
    branches:
      - main
      - test

  pull_request:
    branches:
      - main
      - test

  workflow_dispatch:
    inputs:
      target_platform:
        description: "Select platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows


# ============================================================
# 1. PYTHON LINT
# ============================================================

jobs:

  flake8-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Critical Flake8 checks
        working-directory: terminal-ai-agent
        run: |
          flake8 . \
            --select=E9,F63,F7,F82 \
            --exclude=.venv,venv,build,dist,__pycache__

      - name: Complexity and line length
        working-directory: terminal-ai-agent
        run: |
          flake8 . \
            --max-complexity=15 \
            --max-line-length=120 \
            --exclude=.venv,venv,build,dist,__pycache__ \
            --exit-zero


# ============================================================
# 2. PYTHON UNIT TESTS
# ============================================================

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: flake8-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: terminal-ai-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: terminal-ai-agent
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml


# ============================================================
# 3. PYTHON SECURITY - BANDIT
# ============================================================

  bandit-security:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        working-directory: terminal-ai-agent
        run: |
          bandit -r . \
            -x .venv,venv,build,dist,__pycache__ \
            -ll \
            -ii


# ============================================================
# 4. PYTHON DEPENDENCY VULNERABILITY SCAN
# ============================================================

  dependency-security:
    name: Python Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: terminal-ai-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        working-directory: terminal-ai-agent
        run: |
          pip-audit


# ============================================================
# 5. SECRET SCANNING
# ============================================================

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ============================================================
# 6. FILESYSTEM VULNERABILITY SCAN
# ============================================================

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


# ============================================================
# 7. FLUTTER QUALITY
# ============================================================

  flutter-quality:
    name: Flutter Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Flutter analyze
        working-directory: deskmate_app
        run: |
          flutter analyze

      - name: Check formatting
        working-directory: deskmate_app
        run: |
          dart format \
            --output=none \
            --set-exit-if-changed \
            .

      - name: Flutter tests
        working-directory: deskmate_app
        run: |
          flutter test


# ============================================================
# 8. GITHUB DEPENDENCY REVIEW
# ============================================================

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


# ============================================================
# 9. CHECK CHANGED FILES
# ============================================================

  check-changes:
    name: Check Changed Components
    runs-on: ubuntu-latest

    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      macos: ${{ steps.filter.outputs.macos }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            windows:
              - 'deskmate_app/**'
              - 'terminal-ai-agent/**'
              - 'deskmate_app/windows/**'
              - '.github/workflows/**'

            macos:
              - 'deskmate_app/**'
              - 'terminal-ai-agent/**'
              - 'deskmate_app/macos/**'
              - '.github/workflows/**'


# ============================================================
# 10. WINDOWS BUILD
# ============================================================

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    needs:
      - flake8-lint
      - python-tests
      - bandit-security
      - dependency-security
      - secret-scan
      - trivy-scan
      - flutter-quality
      - check-changes

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.target_platform == 'all' ||
          github.event.inputs.target_platform == 'windows'
        )
      )
      ||
      (
        github.event_name == 'push' &&
        needs.check-changes.outputs.windows == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Python environment
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -r requirements.txt
          .\.venv\Scripts\pip.exe install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          .\.venv\Scripts\pyinstaller.exe deskmate_backend.spec --clean

      - name: Copy backend executable
        shell: pwsh
        run: |
          Copy-Item `
            "terminal-ai-agent\dist\deskmate_backend.exe" `
            "deskmate_app\assets\deskmate_backend.exe" `
            -Force

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Build Windows application
        working-directory: deskmate_app
        run: |
          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          if (!(Test-Path "deskmate_app\build\windows\x64\runner\Release")) {
            Write-Error "Windows build output not found"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-Windows
          path: deskmate_app/build/windows/x64/runner/Release


# ============================================================
# 11. MACOS BUILD
# ============================================================

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    needs:
      - flake8-lint
      - python-tests
      - bandit-security
      - dependency-security
      - secret-scan
      - trivy-scan
      - flutter-quality
      - check-changes

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.target_platform == 'all' ||
          github.event.inputs.target_platform == 'macos'
        )
      )
      ||
      (
        github.event_name == 'push' &&
        needs.check-changes.outputs.macos == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Python environment
        working-directory: terminal-ai-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        run: |
          .venv/bin/pyinstaller deskmate_backend.spec --clean

      - name: Copy backend binary
        run: |
          cp \
            terminal-ai-agent/dist/deskmate_backend \
            deskmate_app/assets/deskmate_backend

          chmod +x deskmate_app/assets/deskmate_backend

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Build macOS application
        working-directory: deskmate_app
        run: |
          flutter build macos --release

      - name: Verify macOS build
        run: |
          test -d deskmate_app/build/macos/Build/Products/Release

      - name: Create DMG
        run: |
          mkdir -p dmg

          cp -R \
            deskmate_app/build/macos/Build/Products/Release/*.app \
            dmg/

          hdiutil create \
            -volname "DeskMate" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            DeskMate-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-DMG
          path: DeskMate-macOS.dmg

      - name: Zip macOS application
        run: |
          cd deskmate_app/build/macos/Build/Products/Release
          zip -r ../../../../../DeskMate-macOS.zip *.app

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-App
          path: DeskMate-macOS.zip
