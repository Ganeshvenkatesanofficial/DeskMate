name: Build DeskMate Multi-Platform Releases

on:
  push:
    branches:
      - main
      - test

  pull_request:
    branches:
      - main
      - test

  workflow_dispatch:
    inputs:
      target_platform:
        description: "Select platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows

permissions:
  contents: read

# ============================================================
# JOBS
# ============================================================

jobs:

  # ============================================================
  # 1. PYTHON LINT
  # ============================================================

  flake8-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Critical Flake8 checks
        working-directory: terminal-ai-agent
        run: |
          flake8 . \
            --select=E9,F63,F7,F82 \
            --exclude=.venv,venv,build,dist,__pycache__

  # ============================================================
  # 2. PYTHON TESTS
  # ============================================================

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        working-directory: terminal-ai-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python tests
        working-directory: terminal-ai-agent
        run: |
          status=0
          python -m pytest -v || status=$?

          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
            exit "$status"
          fi

  # ============================================================
  # 3. BANDIT SECURITY SCAN
  # ============================================================

  bandit-security:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Scan Python code
        working-directory: terminal-ai-agent
        run: |
          bandit -r . \
            -x ./.venv,./venv,./build,./dist,./__pycache__ \
            -f txt

  # ============================================================
  # 4. PYTHON DEPENDENCY SECURITY
  # ============================================================

  dependency-security:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python dependencies
        working-directory: terminal-ai-agent
        run: |
          pip-audit -r requirements.txt

  # ============================================================
  # 5. SECRET SCAN
  # ============================================================

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2

  # ============================================================
  # 6. TRIVY FILESYSTEM SECURITY SCAN
  # ============================================================

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ============================================================
  # 7. FLUTTER QUALITY CHECKS
  # ============================================================

  flutter-quality:
    name: Flutter Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Check Dart formatting
        working-directory: deskmate_app
        run: |
          dart format --output=none --set-exit-if-changed .

      - name: Flutter static analysis
        working-directory: deskmate_app
        run: |
          flutter analyze --fatal-infos

  # ============================================================
  # 8. BUILD MACOS
  # ============================================================

  macos-build:
    name: Build macOS
    runs-on: macos-latest

    needs:
      - flake8-lint
      - python-tests
      - bandit-security
      - dependency-security
      - secret-scan
      - trivy-scan
      - flutter-quality

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.target_platform == 'all' ||
          inputs.target_platform == 'macos'
        )
      ) ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Python environment
        working-directory: terminal-ai-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        run: |
          .venv/bin/pyinstaller deskmate_backend.spec --clean

      - name: Copy backend binary
        run: |
          mkdir -p deskmate_app/assets/backend

          cp \
            terminal-ai-agent/dist/deskmate_backend \
            deskmate_app/assets/backend/deskmate_backend

          chmod +x deskmate_app/assets/backend/deskmate_backend

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Build macOS application
        working-directory: deskmate_app
        run: |
          flutter build macos --release

      - name: Verify macOS build
        run: |
          test -d deskmate_app/build/macos/Build/Products/Release

          find \
            deskmate_app/build/macos/Build/Products/Release \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit | grep -q .

      - name: Create DMG
        run: |
          mkdir -p dmg

          cp -R \
            deskmate_app/build/macos/Build/Products/Release/*.app \
            dmg/

          hdiutil create \
            -volname "DeskMate" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            DeskMate-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-DMG
          path: DeskMate-macOS.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Zip macOS application
        run: |
          cd deskmate_app/build/macos/Build/Products/Release

          ditto -c -k --sequesterRsrc --keepParent \
            *.app "$GITHUB_WORKSPACE/DeskMate-macOS.zip"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-App
          path: DeskMate-macOS.zip
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # 9. BUILD WINDOWS
  # ============================================================

  windows-build:
    name: Build Windows
    runs-on: windows-latest

    needs:
      - flake8-lint
      - python-tests
      - bandit-security
      - dependency-security
      - secret-scan
      - trivy-scan
      - flutter-quality

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.target_platform == 'all' ||
          inputs.target_platform == 'windows'
        )
      ) ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Python environment
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          .venv\Scripts\pyinstaller deskmate_backend.spec --clean

      - name: Copy backend binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "deskmate_app/assets/backend" | Out-Null

          Copy-Item `
            "terminal-ai-agent/dist/deskmate_backend.exe" `
            "deskmate_app/assets/backend/deskmate_backend.exe"

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: |
          flutter pub get

      - name: Build Windows application
        working-directory: deskmate_app
        run: |
          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          $release = "deskmate_app/build/windows/x64/runner/Release"

          if (!(Test-Path $release)) {
            throw "Windows release directory not found."
          }

          if (!(Get-ChildItem $release -Filter "*.exe" -File)) {
            throw "No Windows executable was generated."
          }

      - name: Package Windows application
        shell: pwsh
        run: |
          $release = "deskmate_app/build/windows/x64/runner/Release"

          Compress-Archive `
            -Path "$release/*" `
            -DestinationPath "DeskMate-Windows.zip" `
            -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-Windows
          path: DeskMate-Windows.zip
          if-no-files-found: error
          retention-days: 14
