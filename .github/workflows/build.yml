name: DeskMate CI/CD Pipeline

on:
  push:
    branches:
      - main
      - test

  pull_request:
    branches:
      - main
      - test

  workflow_dispatch:
    inputs:
      target_platform:
        description: "Select platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos


# ============================================================
# 1️⃣ CODE QUALITY
# ============================================================

jobs:

  code-quality:
    name: "1️⃣ Code Quality"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Python
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Flake8 critical checks
        working-directory: terminal-ai-agent
        run: |
          flake8 . \
            --select=E9,F63,F7,F82 \
            --exclude=.venv,venv,build,dist,__pycache__

      - name: Flake8 complexity and line length
        working-directory: terminal-ai-agent
        run: |
          flake8 . \
            --max-complexity=15 \
            --max-line-length=120 \
            --exclude=.venv,venv,build,dist,__pycache__ \
            --exit-zero

      # -------------------------
      # Flutter
      # -------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: deskmate_app
        run: flutter analyze

      - name: Check Dart formatting
        working-directory: deskmate_app
        run: |
          dart format \
            --output=none \
            --set-exit-if-changed \
            .


# ============================================================
# 2️⃣ TESTS
# ============================================================

  tests:
    name: "2️⃣ Tests"
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Python Tests
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        working-directory: terminal-ai-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python tests
        working-directory: terminal-ai-agent
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml

      # -------------------------
      # Flutter Tests
      # -------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: deskmate_app
        run: flutter test


# ============================================================
# 3️⃣ SECURITY
# ============================================================

  security:
    name: "3️⃣ Security"
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Bandit
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit Python security scan
        working-directory: terminal-ai-agent
        run: |
          bandit -r . \
            -x .venv,venv,build,dist,__pycache__ \
            -ll \
            -ii

      # -------------------------
      # pip-audit
      # -------------------------

      - name: Install application dependencies
        working-directory: terminal-ai-agent
        run: |
          pip install -r requirements.txt

      - name: Python dependency vulnerability scan
        working-directory: terminal-ai-agent
        run: |
          pip-audit

      # -------------------------
      # Gitleaks
      # -------------------------

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # Trivy
      # -------------------------

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


# ============================================================
# 4️⃣ DEPENDENCY REVIEW
# ============================================================

  dependency-review:
    name: "4️⃣ Dependency Review"
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


# ============================================================
# 5️⃣ CHECK CHANGES
# ============================================================

  check-changes:
    name: "5️⃣ Change Detection"
    runs-on: ubuntu-latest

    needs:
      - security
      - dependency-review

    if: |
      always() &&
      needs.security.result == 'success' &&
      (
        needs.dependency-review.result == 'success' ||
        needs.dependency-review.result == 'skipped'
      )

    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      macos: ${{ steps.filter.outputs.macos }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect platform changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            windows:
              - 'deskmate_app/**'
              - 'terminal-ai-agent/**'
              - 'deskmate_app/windows/**'
              - '.github/workflows/**'

            macos:
              - 'deskmate_app/**'
              - 'terminal-ai-agent/**'
              - 'deskmate_app/macos/**'
              - '.github/workflows/**'


# ============================================================
# 6️⃣ WINDOWS RELEASE
# ============================================================

  build-windows:
    name: "6️⃣ Windows Release"
    runs-on: windows-latest

    needs: check-changes

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.target_platform == 'all' ||
          github.event.inputs.target_platform == 'windows'
        )
      )
      ||
      (
        github.event_name == 'push' &&
        needs.check-changes.outputs.windows == 'true'
      )

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # -------------------------
      # Python Backend
      # -------------------------

      - name: Create Python environment
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          python -m venv .venv

          .\.venv\Scripts\python.exe -m pip install --upgrade pip

          .\.venv\Scripts\pip.exe install -r requirements.txt

          .\.venv\Scripts\pip.exe install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          .\.venv\Scripts\pyinstaller.exe `
            deskmate_backend.spec `
            --clean

      - name: Copy backend executable
        shell: pwsh
        run: |
          Copy-Item `
            "terminal-ai-agent\dist\deskmate_backend.exe" `
            "deskmate_app\assets\deskmate_backend.exe" `
            -Force

      # -------------------------
      # Flutter
      # -------------------------

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: flutter pub get

      - name: Build Windows application
        working-directory: deskmate_app
        run: flutter build windows --release

      # -------------------------
      # Verify
      # -------------------------

      - name: Verify Windows build
        shell: pwsh
        run: |
          if (!(Test-Path "deskmate_app\build\windows\x64\runner\Release")) {
            Write-Error "Windows build output not found"
            exit 1
          }

      # -------------------------
      # Artifact
      # -------------------------

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-Windows
          path: deskmate_app/build/windows/x64/runner/Release


# ============================================================
# 7️⃣ MACOS RELEASE
# ============================================================

  build-macos:
    name: "7️⃣ macOS Release"
    runs-on: macos-latest

    needs: check-changes

    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.target_platform == 'all' ||
          github.event.inputs.target_platform == 'macos'
        )
      )
      ||
      (
        github.event_name == 'push' &&
        needs.check-changes.outputs.macos == 'true'
      )

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # -------------------------
      # Python Backend
      # -------------------------

      - name: Create Python environment
        working-directory: terminal-ai-agent
        run: |
          python -m venv .venv

          .venv/bin/python -m pip install --upgrade pip

          .venv/bin/pip install -r requirements.txt

          .venv/bin/pip install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        run: |
          .venv/bin/pyinstaller \
            deskmate_backend.spec \
            --clean

      - name: Copy backend binary
        run: |
          cp \
            terminal-ai-agent/dist/deskmate_backend \
            deskmate_app/assets/deskmate_backend

          chmod +x \
            deskmate_app/assets/deskmate_backend

      # -------------------------
      # Flutter
      # -------------------------

      - name: Flutter dependencies
        working-directory: deskmate_app
        run: flutter pub get

      - name: Build macOS application
        working-directory: deskmate_app
        run: flutter build macos --release

      # -------------------------
      # Verify
      # -------------------------

      - name: Verify macOS build
        run: |
          test -d \
            deskmate_app/build/macos/Build/Products/Release

      # -------------------------
      # DMG
      # -------------------------

      - name: Create DMG
        run: |
          mkdir -p dmg

          cp -R \
            deskmate_app/build/macos/Build/Products/Release/*.app \
            dmg/

          hdiutil create \
            -volname "DeskMate" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            DeskMate-macOS.dmg

      # -------------------------
      # Upload DMG
      # -------------------------

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-DMG
          path: DeskMate-macOS.dmg

      # -------------------------
      # ZIP
      # -------------------------

      - name: Create macOS ZIP
        run: |
          cd deskmate_app/build/macos/Build/Products/Release

          zip -r \
            ../../../../../DeskMate-macOS.zip \
            *.app

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-App
          path: DeskMate-macOS.zip
