name: Build DeskMate Multi-Platform Releases

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]
  workflow_dispatch:

jobs:
  flake8-lint:
    name: Run Python Code Quality (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 check
        working-directory: terminal-ai-agent
        run: |
          # Stop build if there are syntax errors or undefined names
          flake8 . --exclude=.venv,venv,build,dist,__pycache__,.git --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity and line-length style check (non-blocking)
          flake8 . --exclude=.venv,venv,build,dist,__pycache__,.git --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  build-windows:
    name: Build Windows Executable Release
    needs: flake8-lint
    runs-on: windows-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Python venv and install dependencies
        working-directory: terminal-ai-agent
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt pyinstaller

      - name: Build Python Backend EXE with PyInstaller
        working-directory: terminal-ai-agent
        run: |
          .venv\Scripts\python -m PyInstaller --clean deskmate_backend.spec

      - name: Copy backend EXE to Flutter assets
        run: |
          New-Item -ItemType Directory -Path "deskmate_app\assets\backend" -Force
          Copy-Item -Path "terminal-ai-agent\dist\deskmate_backend.exe" -Destination "deskmate_app\assets\backend\deskmate_backend.exe" -Force

      - name: Build Flutter Windows Release
        working-directory: deskmate_app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-Windows-Release
          path: deskmate_app/build/windows/x64/runner/Release/

  build-macos:
    name: Build macOS App Bundle Release
    needs: flake8-lint
    runs-on: macos-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Python venv and install dependencies
        working-directory: terminal-ai-agent
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller

      - name: Build Python Backend macOS Binary with PyInstaller
        working-directory: terminal-ai-agent
        run: |
          .venv/bin/python -m PyInstaller --clean deskmate_backend.spec

      - name: Copy backend binary to Flutter assets
        run: |
          mkdir -p deskmate_app/assets/backend
          cp terminal-ai-agent/dist/deskmate_backend deskmate_app/assets/backend/deskmate_backend
          chmod +x deskmate_app/assets/backend/deskmate_backend

      - name: Build Flutter macOS Release
        working-directory: deskmate_app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Create macOS DMG Installer
        run: |
          hdiutil create -volname "DeskMate" -srcfolder deskmate_app/build/macos/Build/Products/Release/DeskMate.app -ov -format UDZO deskmate_app/build/macos/Build/Products/Release/DeskMate.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-DMG
          path: deskmate_app/build/macos/Build/Products/Release/DeskMate.dmg
