name: Build DeskMate Multi-Platform Releases

on:
  push:
    branches: [main, test]

  pull_request:
    branches: [main, test]

  workflow_dispatch:
    inputs:
      target_platform:
        description: Select platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows

jobs:
  # ==========================================
  # 1. PYTHON LINT
  # ==========================================
  flake8-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run critical Flake8 checks
        working-directory: terminal-ai-agent
        run: |
          flake8 . \
            --select=E9,F63,F7,F82 \
            --exclude=.venv,venv,build,dist,__pycache__

  # ==========================================
  # 2. BUILD MACOS
  # ==========================================
  macos-build:
    name: Build macOS
    runs-on: macos-latest
    needs: flake8-lint

    if: |
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target_platform == 'all' || inputs.target_platform == 'macos')) ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Python dependencies
        working-directory: terminal-ai-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        run: |
          .venv/bin/pyinstaller deskmate_backend.spec --clean

      - name: Copy backend binary
        run: |
          mkdir -p deskmate_app/assets/backend
          cp terminal-ai-agent/dist/deskmate_backend \
            deskmate_app/assets/backend/deskmate_backend
          chmod +x deskmate_app/assets/backend/deskmate_backend

      - name: Install Flutter dependencies
        working-directory: deskmate_app
        run: flutter pub get

      - name: Build macOS app
        working-directory: deskmate_app
        run: flutter build macos --release

      - name: Create macOS DMG
        run: |
          mkdir -p dmg
          cp -R deskmate_app/build/macos/Build/Products/Release/*.app dmg/
          hdiutil create \
            -volname "DeskMate" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            DeskMate-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-DMG
          path: DeskMate-macOS.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Create macOS ZIP
        run: |
          cd deskmate_app/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            *.app "$GITHUB_WORKSPACE/DeskMate-macOS.zip"

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-macOS-App
          path: DeskMate-macOS.zip
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 3. BUILD WINDOWS
  # ==========================================
  windows-build:
    name: Build Windows
    runs-on: windows-latest
    needs: flake8-lint

    if: |
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target_platform == 'all' || inputs.target_platform == 'windows')) ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Python dependencies
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller

      - name: Build backend
        working-directory: terminal-ai-agent
        shell: pwsh
        run: |
          .venv\Scripts\pyinstaller deskmate_backend.spec --clean

      - name: Copy backend binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "deskmate_app/assets/backend" | Out-Null

          Copy-Item `
            "terminal-ai-agent/dist/deskmate_backend.exe" `
            "deskmate_app/assets/backend/deskmate_backend.exe"

      - name: Install Flutter dependencies
        working-directory: deskmate_app
        run: flutter pub get

      - name: Build Windows app
        working-directory: deskmate_app
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $release = "deskmate_app/build/windows/x64/runner/Release"

          if (!(Test-Path $release)) {
            throw "Windows release directory not found."
          }

          Compress-Archive `
            -Path "$release/*" `
            -DestinationPath "DeskMate-Windows.zip" `
            -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DeskMate-Windows
          path: DeskMate-Windows.zip
          if-no-files-found: error
          retention-days: 14
